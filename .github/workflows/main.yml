name: API Testing Pipeline - Restful Booker

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Atualizado para evitar o aviso de depreciação

      - name: Instalar Newman e Repórter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Verificar Vulnerabilidades (SCA)
        # O || true garante que a pipeline continue mesmo se houver falhas, 
        # para que você possa ver os resultados no log sem travar os testes.
        run: npm audit --audit-level=high || true 

      - name: Executar testes de API
        run: |
          mkdir -p results
          newman run "collections/restful_booker_strategy.json" \
          -e "environments/restful_booker_prod.json" \
          -r cli,htmlextra \
          --reporter-htmlextra-export results/report.html

      - name: Salvar Relatório de Testes
        if: always() # Garante que tente salvar mesmo se algo falhar
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: results/report.html