name: API Testing Pipeline - Restful Booker

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar Newman e Repórter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      # Nova camada de segurança de Arquitetura de Suporte
      - name: Verificar Vulnerabilidades (SCA)
        run: npm audit --audit-level=high

      - name: Executar Testes de API
        run: |
          newman run "collections/restful_booker_strategy.json" \
          -e "environments/restful_booker_prod.json" \
          -r cli,htmlextra \
          --reporter-htmlextra-export results/report.html

      - name: Salvar Relatório de Testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: results/report.html
